name: Check
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run version:check
      - run: npm run check
      - run: powershell -NoProfile -File scripts/run-cargo-msvc.ps1 fmt --check
      - run: npm run test:rust
      - run: powershell -NoProfile -File scripts/run-cargo-msvc.ps1 clippy --lib -- -D warnings
